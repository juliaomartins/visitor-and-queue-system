openapi: 3.0.3
info:
  title: VMS API
  version: 0.1.0
  description: Visitor Management System — event badge scanning on a closed LAN.
paths:
  /api/v1/assistant/chat:
    post:
      operationId: assistant_chat_create
      description: |-
        Send one message, and the conversation it belongs to (omit it to start a new one). The server loads the conversation's stored history, so the assistant remembers it; the question and the answer are saved together only once the answer exists, so a failed call saves nothing and can be retried. `locale` is the dashboard's language, used only when the message is too short to tell its own.

        The answer is generated by an OpenAI model from rows retrieved through the same services as `/reports/entries`. Read-only, except notes the admin explicitly asks it to remember (`remembered`).

        `answer.downloads` lists files the answer offers. They are not attached: fetch `entrance_report` from `/reports/entries.{format}` with its filters and `visitor_list` from `/badges/roster.xlsx`.

        404 for a conversation that is not this admin's. 503 when no OpenAI key is configured or OpenAI is unreachable; 502 when OpenAI rejects the key or the model.
      summary: Ask the data assistant a question
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
          description: ''
  /api/v1/assistant/conversations:
    get:
      operationId: assistant_conversations_list
      summary: This admin's recent assistant conversations, newest first
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
          description: ''
  /api/v1/assistant/conversations/{id}:
    get:
      operationId: assistant_conversations_retrieve
      summary: One conversation with every message
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
    delete:
      operationId: assistant_conversations_destroy
      summary: Delete a conversation and its messages, for good
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistant/memories:
    get:
      operationId: assistant_memories_list
      summary: What the assistant remembers for this admin
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryNote'
          description: ''
  /api/v1/assistant/memories/{id}:
    delete:
      operationId: assistant_memories_destroy
      summary: Forget one note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistant/status:
    get:
      operationId: assistant_status_retrieve
      summary: Whether the chat assistant is configured on this server
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantStatus'
          description: ''
  /api/v1/auth/token:
    post:
      operationId: auth_token_create
      description: '`POST /api/v1/auth/token` — admin login.'
      summary: Admin login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/token/blacklist:
    post:
      operationId: auth_token_blacklist_create
      description: |-
        `POST /api/v1/auth/token/blacklist` — logout.

        Blacklisting an already-dead token still clears the cookie: a logout must not
        leave the browser holding something that looks like a session.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '205':
          description: No response body
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        `POST /api/v1/auth/token/refresh` — rotate on the cookie.

        `ROTATE_REFRESH_TOKENS` + `BLACKLIST_AFTER_ROTATION` mean every call issues a
        new refresh token and kills the old one, so the cookie is rewritten here.
      summary: Refresh the access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/badges/card:
    post:
      operationId: badges_card_create
      description: |-
        Takes the raw badge token returned once by `POST /visitors` and returns a CR80 card as a PDF. The token draws the QR and is then discarded; it is never stored, and the visitor is resolved from its digest.

        There is no GET equivalent. Only the digest is kept, so the server cannot reprint a card without being handed the token again.
      summary: Render a single badge PDF
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeCardRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeCardRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeCardRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: A CR80 badge PDF.
        '404':
          description: No visitor holds that token.
  /api/v1/badges/export:
    post:
      operationId: badges_export_create
      description: |-
        NON-DESTRUCTIVE. Every QR in the file is the code ALREADY on that visitor's card, recomputed from the derived token, so nothing is reissued and no printed card stops scanning. Exporting twice produces an identical file.

        A printing worklist: a title banner naming the event, then No. / Name / Country / Organization / Category / Badge Serial / Photo / QR Code / Registered / QR payload from row 5, with the banner frozen. The payload is the exact string the QR encodes, so a card producer can re-render it at their own size.

        It therefore contains working credentials, and a second sheet says so, because a spreadsheet outlives the click that made it.

        Omit `visitor_ids` to take every visitor who has not been deleted.
      summary: Export badges as .xlsx with photos and QR codes
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeExportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeExportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeExportRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: An .xlsx workbook with one QR per visitor.
  /api/v1/badges/reissue:
    post:
      operationId: badges_reissue_create
      description: |-
        DESTRUCTIVE. Every listed visitor is given a NEW badge token, which invalidates the QR on any card already printed for them.

        Returns the raw tokens so a client can render the QR itself — on screen, or into its own layout. The server cannot return the token of an existing card, only of one it has just minted.

        This response is the ONLY copy. Nothing stores it.
      summary: Reissue badges and return their raw tokens
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueResponse'
          description: ''
  /api/v1/badges/reissue-sheet:
    post:
      operationId: badges_reissue_sheet_create
      description: |-
        NOT destructive, despite the route's name. Badge tokens are derived from the visitor and their token version, so this recomputes the QR already on each card rather than minting a new one. Printing a run twice produces the same cards and invalidates nothing.

        One card per page, 95x130mm — the size the event's PVC cards are cut to, and the size of the organisers' own production file. There is no A4 sheet and no cut marks: these cards are printed on a card printer, and three 95mm cards do not fit across a 210mm page.
      summary: Render the listed visitors' badges as a printable PDF
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: A PDF of 95x130mm badge pages, one per visitor.
  /api/v1/badges/roster.xlsx:
    get:
      operationId: badges_roster_export_retrieve
      description: |-
        Who is registered, as a printing worklist: a title banner naming the event, then No. / Name / Country / Organization / Photo / QR Code / Registered from row 5, with the banner frozen.

        NON-DESTRUCTIVE. Nothing is reissued and no card stops working. Each QR is the visitor's existing badge token, derived rather than stored, so the code drawn here is the code already on their card.

        It therefore contains working credentials. Use POST /badges/export instead only when an outside card producer needs freshly minted tokens and every current card is being replaced.
      summary: Export the visitor roster as .xlsx
      tags:
      - badges
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: An .xlsx workbook.
  /api/v1/desk/qr:
    get:
      operationId: desk_qr_retrieve
      description: Desk devices only. Send the badge token from the registration response
        in the `X-Badge-Token` header -- never in the query string, which the server
        writes to its access log. Returns a PNG for the visitor to photograph.
      summary: Draw the QR code for a badge
      parameters:
      - in: header
        name: X-Badge-Token
        schema:
          type: string
        description: The badge token returned by POST /desk/registrations.
        required: true
      tags:
      - desk
      security:
      - deviceAuth: []
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: The QR code, with the event mark in the middle.
        '400':
          description: No badge token was sent.
        '403':
          description: A paired desk device is required.
        '404':
          description: No badge matches that token.
  /api/v1/desk/registrations:
    post:
      operationId: desk_registrations_create
      description: Desk devices only. Creates a visitor with `source=desk` and the
        chosen category, and issues their badge. The response is the one and only
        sight of the badge token. 413 above the upload limit; 429 when rate-limited.
      summary: Register a walk-in visitor
      tags:
      - desk
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeskRegistrationRequest'
        required: true
      security:
      - deviceAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeskRegistrationResult'
          description: ''
        '400':
          description: A field failed validation.
        '403':
          description: A paired desk device is required.
        '413':
          description: The upload is too large.
        '429':
          description: Too many registrations.
  /api/v1/devices:
    get:
      operationId: devices_list
      summary: List paired devices
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/{id}/revoke:
    post:
      operationId: devices_revoke_create
      description: The device's scan history stays; its token stops working.
      summary: Revoke a device
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this device.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/pair:
    post:
      operationId: devices_pair_create
      description: Returns the permanent device token. It is stored only as a SHA-256
        digest, so this response is the single chance to capture it.
      summary: Redeem a pairing code
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePaired'
          description: ''
  /api/v1/devices/pairing-code:
    post:
      operationId: devices_pairing_code_create
      description: Short-lived, single-use. Read it off the dashboard and type it
        into the device standing next to you.
      summary: Generate a pairing code
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
          description: ''
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: Public. Used by the scanner and the lobby screen to find the server
        when its address has changed. Returns the LAN address the server believes
        it has, which is what devices should be pointed at.
      summary: Liveness and identity probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/public/registrations:
    post:
      operationId: public_registrations_create
      description: Public, unauthenticated. Creates a visitor with category `normal`
        and issues their badge. Returns only what a success screen needs to draw the
        QR. 403 while registration is closed; 413 above the upload limit; 429 when
        rate-limited.
      summary: Register yourself as a visitor
      tags:
      - public
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicRegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegistrationResult'
          description: ''
        '400':
          description: A field failed validation.
        '403':
          description: Registration is closed.
        '413':
          description: The upload is too large.
        '429':
          description: Too many registrations.
  /api/v1/public/registrations/status:
    get:
      operationId: public_registrations_status_retrieve
      description: Whether the form should render at all.
      summary: Is public registration open?
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegistrationStatus'
          description: ''
  /api/v1/registration-settings:
    get:
      operationId: registration_settings_retrieve
      description: The admin switch. Admin-only, on the admin router, never under
        /public.
      summary: Read the public registration switch
      tags:
      - registration-settings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSettings'
          description: ''
    patch:
      operationId: registration_settings_partial_update
      description: The admin switch. Admin-only, on the admin router, never under
        /public.
      summary: Open or close public registration
      tags:
      - registration-settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRegistrationSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRegistrationSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRegistrationSettingsRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSettings'
          description: ''
  /api/v1/reports/entries:
    get:
      operationId: reports_entries_retrieve
      description: |-
        Every badge presented in the range — `valid`, `duplicate`, `revoked` and `invalid` alike. This is the security audit as well as the attendance record, so refusals are in the default view rather than behind a filter.

        Hours are bucketed in the event's timezone, which the response names in `timezone`. Unfiltered and unpaginated: a day of a 250-visitor event is a few thousand rows on a LAN.
      summary: Entrance log with totals
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryReport'
          description: ''
  /api/v1/reports/entries.csv:
    get:
      operationId: reports_entries_csv_retrieve
      description: The same filters as `/reports/entries`. Timestamps are in the event's
        timezone with the offset attached; visitor columns are blank for an `invalid`
        scan, which matched no badge.
      summary: Export the entrance log as CSV
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: text/csv
  /api/v1/reports/entries.pdf:
    get:
      operationId: reports_entries_pdf_retrieve
      description: 'The same filters as `/reports/entries`, as a designed document:
        the headline figures, the findings in sentences, the shape of the day, then
        the tables. Built with ReportLab, so it renders identically wherever the server
        runs.'
      summary: Export the entrance report as PDF
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: application/pdf
  /api/v1/reports/entries.xlsx:
    get:
      operationId: reports_entries_xlsx_retrieve
      description: |-
        The same filters as `/reports/entries`, as a workbook: a summary with the written findings, hourly flow with a chart, delegations, load by door, the registered visitors who never arrived, and the full log.

        Figures are written as numbers, not text, so they can be pivoted without cleaning the file first.
      summary: Export the entrance report as .xlsx
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: xlsx
  /api/v1/scans:
    post:
      operationId: scans_create
      description: 'Always 200 — read `result`, not the status code. A revoked or
        forged badge is a business outcome (`revoked` / `invalid`), which keeps the
        scanner app''s error handling to genuine network failures. A visitor re-presented
        within the dedupe window returns `duplicate`: still logged, but kept off the
        lobby screen.'
      summary: Record a badge scan
      tags:
      - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
        required: true
      security:
      - deviceAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
          description: ''
  /api/v1/screen/feed:
    get:
      operationId: screen_feed_retrieve
      description: Everything the screen missed while it was not listening.
      summary: Backfill arrivals after a reconnect
      parameters:
      - in: query
        name: since
        schema:
          type: integer
        description: Last `id` the screen has already rendered. Omit or pass 0 on
          a cold start.
      tags:
      - screen
      security:
      - deviceAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenFeed'
          description: ''
  /api/v1/visitors:
    get:
      operationId: visitors_list
      summary: List visitors
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Filter by badge category.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country match, case-insensitive.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by badge state. `false` lists deactivated visitors.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - admin
          - desk
          - self
        description: 'Who created the registration: `admin` signed in at the desk,
          `desk` at a paired walk-in desk with no login, or `self` through the public
          form.'
      - in: query
        name: with_tokens
        schema:
          type: boolean
        description: Include `badge_token` on every row. Off by default. Each token
          is a working credential, so this turns one request into a set of usable
          badges -- ask for it only where the codes are the point, such as a print
          queue that draws the real QR. The same codes are already in the .xlsx export.
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorList'
          description: ''
    post:
      operationId: visitors_create
      description: Returns `badge_token`, the raw value for the QR code. It is stored
        only as a SHA-256 digest, so this response is the single chance to capture
        it — generate the badge PDF from it immediately.
      summary: Register a visitor and issue a badge
      tags:
      - visitors
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorIssued'
          description: ''
  /api/v1/visitors/{id}:
    get:
      operationId: visitors_retrieve
      summary: Visitor detail, with scan history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorDetail'
          description: ''
    patch:
      operationId: visitors_partial_update
      summary: Edit a visitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
    delete:
      operationId: visitors_destroy
      summary: Soft-delete a visitor (also deactivates the badge)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/visitors/{id}/activate:
    post:
      operationId: visitors_activate_create
      description: Undo a deactivation. The badge already in the visitor's hand starts
        scanning again — nothing is reissued, because the token never moved.
      summary: Activate a visitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
  /api/v1/visitors/{id}/deactivate:
    post:
      operationId: visitors_deactivate_create
      description: The visitor stays on the list and keeps their scan history; their
        badge stops scanning and shows `revoked` at the door. **The QR is not changed**
        — `activate` puts the same printed card back to work, so a lost badge that
        turns up again needs no reprint.
      summary: Deactivate a visitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
  /api/v1/visitors/{id}/permanent:
    delete:
      operationId: visitors_permanent_destroy
      description: Irreversible. Drops the registration row and the visitor's photo
        from storage. Scans of this badge are kept and anonymised rather than deleted
        -- `ScanEvent.visitor` is set to null, so the entrance log still shows that
        something was presented at that door at that minute, and the response reports
        how many rows that affected. `DELETE /visitors/{id}` is the ordinary removal
        and is reversible by hand; this is not.
      summary: Delete a visitor permanently
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPurged'
          description: ''
components:
  schemas:
    AbsentVisitor:
      type: object
      description: Registered, with no valid scan in the period.
      properties:
        badge_serial:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        organization:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
      required:
      - badge_serial
      - category
      - country
      - full_name
      - organization
    AccessToken:
      type: object
      description: |-
        The auth response body.

        Only the access token is returned. The refresh token goes out as an httpOnly
        cookie so no JavaScript on the dashboard can read it.
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AdminTokenObtainPairRequest:
      type: object
      description: |-
        Username + password → JWT pair, for administrators only.

        A non-staff account would receive a token that `IsAdmin` rejects on every
        endpoint, which reads as a broken dashboard. Failing at login instead says
        what actually happened.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    AssistantStatus:
      type: object
      properties:
        enabled:
          type: boolean
        model:
          type: string
      required:
      - enabled
      - model
    BadgeCardRequestRequest:
      type: object
      description: |-
        What the registration receipt posts back to get a printable card.

        The raw token, and only the raw token. The server resolves the visitor from
        its SHA-256 digest exactly as `/scans` does, so this is not an oracle: a
        caller who does not already hold the token gets nothing, and one who does is
        holding the badge anyway.
      properties:
        token:
          type: string
          minLength: 1
          description: The raw badge token, as returned once by POST /visitors. Not
            stored; used to draw the QR and then discarded.
          maxLength: 128
      required:
      - token
    BadgeExportRequestRequest:
      type: object
      description: |-
        Which visitors go into the credential spreadsheet.

        Every one of them gets a NEW token, for the same reason the sheet does: the
        server keeps only a digest, so a scannable QR can be minted but never
        recovered. Omit the list to take everyone who is still registered.
      properties:
        visitor_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Visitors to reissue and export, in row order. Omit to export
            every visitor who has not been deleted.
          maxItems: 250
    BadgeReissueSheetRequestRequest:
      type: object
      description: |-
        Which visitors to print, and in what order.

        Nobody's token changes — tokens are derived, so the run redraws the QR each
        of these visitors is already carrying. See the endpoint description.
      properties:
        visitor_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Visitors to print, in the order the pages should come out.
          maxItems: 250
      required:
      - visitor_ids
    CategoryCount:
      type: object
      properties:
        category:
          type: string
          readOnly: true
        total:
          type: integer
          readOnly: true
      required:
      - category
      - total
    CategoryEnum:
      enum:
      - normal
      - vip
      type: string
      description: |-
        * `normal` - Normal
        * `vip` - VIP
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/DownloadOffer'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - downloads
      - id
      - role
    ChatRequestRequest:
      type: object
      description: |-
        Only the new message. The history comes from the database, not the
        browser -- so a reload loses nothing and a client cannot rewrite the past.
      properties:
        conversation:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
          minLength: 1
          maxLength: 4000
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: en
      required:
      - message
    ChatResponse:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ConversationSummary'
        question:
          $ref: '#/components/schemas/ChatMessage'
        answer:
          $ref: '#/components/schemas/ChatMessage'
        remembered:
          type: array
          items:
            type: string
      required:
      - answer
      - conversation
      - question
      - remembered
    ConversationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        message_count:
          type: integer
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          readOnly: true
      required:
      - created_at
      - id
      - locale
      - message_count
      - messages
      - title
      - updated_at
    ConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        message_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - locale
      - message_count
      - title
      - updated_at
    CountryCount:
      type: object
      properties:
        country:
          type: string
          readOnly: true
        total:
          type: integer
          readOnly: true
      required:
      - country
      - total
    DeskRegistrationRequest:
      type: object
      description: '`POST /desk/registrations`, multipart. Exactly these five fields.'
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          default: ''
          maxLength: 200
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          default: normal
          description: |-
            `normal` or `vip`.

            * `normal` - Normal
            * `vip` - VIP
        photo:
          type: string
          format: binary
          description: JPEG, PNG or WebP, at most 5 MB. Re-encoded by the server.
      required:
      - country
      - full_name
      - photo
    DeskRegistrationResult:
      type: object
      description: |-
        Only what the desk screen needs to show the visitor.

        `badge_token` is the QR payload, and it is also the key the desk hands back
        to `GET /desk/qr` to have the code drawn. No id, no photo URL, no token
        hash: nothing here lets the desk reach any other visitor's badge.
      properties:
        full_name:
          type: string
        badge_serial:
          type: string
          description: Printed on the card; quoted at the kiosk desk if a scan fails.
        badge_token:
          type: string
          description: Raw badge token for the QR code. Returned once, never again.
        category:
          type: string
          description: '`normal` or `vip`, as registered.'
      required:
      - badge_serial
      - badge_token
      - category
      - full_name
    Device:
      type: object
      description: '`token_hash` is deliberately absent — the raw token is shown once,
        at pairing.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_active:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - last_seen_at
      - name
      - updated_at
    DevicePairRequestRequest:
      type: object
      description: What a device posts to `/devices/pair` — the only endpoint with
        no token.
      properties:
        code:
          type: string
          minLength: 1
          description: The 6-character code shown on the dashboard.
          maxLength: 8
        name:
          type: string
          description: Optional label, e.g. 'North door'. Defaults to 'Scanner 2'.
          maxLength: 100
      required:
      - code
    DevicePaired:
      type: object
      description: |-
        The pairing response — the one and only sight of the raw device token.

        The scanner writes `token` to expo-secure-store; the screen keeps it in its
        local config. It cannot be recovered afterwards, only reissued by pairing again.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_active:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        token:
          type: string
          readOnly: true
          description: 'Permanent device token. Sent as `Authorization: Device <token>`.'
      required:
      - created_at
      - id
      - kind
      - last_seen_at
      - name
      - token
      - updated_at
    DoorLoad:
      type: object
      description: One door's share of the traffic.
      properties:
        device:
          type: string
          readOnly: true
        total:
          type: integer
          readOnly: true
        valid:
          type: integer
          readOnly: true
        refused:
          type: integer
          readOnly: true
        share:
          type: number
          format: double
          readOnly: true
      required:
      - device
      - refused
      - share
      - total
      - valid
    DownloadFilters:
      type: object
      properties:
        date_from:
          type: string
          format: date
          nullable: true
        date_to:
          type: string
          format: date
          nullable: true
        country:
          type: string
          nullable: true
        category:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CategoryEnum'
          - $ref: '#/components/schemas/NullEnum'
        result:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ResultEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - category
      - country
      - date_from
      - date_to
      - result
    DownloadOffer:
      type: object
      description: A file the answer offers. The dashboard fetches it from the export
        view.
      properties:
        report:
          $ref: '#/components/schemas/ReportEnum'
        format:
          $ref: '#/components/schemas/FormatEnum'
        filters:
          $ref: '#/components/schemas/DownloadFilters'
      required:
      - filters
      - format
      - report
    Entry:
      type: object
      description: One badge presentation, valid or not.
      properties:
        id:
          type: integer
          readOnly: true
        scanned_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/ResultEnum'
        visitor:
          type: string
          format: uuid
          nullable: true
        full_name:
          type: string
          readOnly: true
          nullable: true
        country:
          type: string
          readOnly: true
          nullable: true
        organization:
          type: string
          readOnly: true
          nullable: true
        category:
          type: string
          readOnly: true
          nullable: true
        badge_serial:
          type: string
          readOnly: true
          nullable: true
        device_name:
          type: string
          readOnly: true
      required:
      - badge_serial
      - category
      - country
      - device_name
      - full_name
      - id
      - organization
      - result
      - scanned_at
    EntryReport:
      type: object
      description: |-
        `GET /reports/entries` — the log, its totals, and what they mean.

        `insights` carries the derived findings the PDF and the workbook print, so the
        dashboard renders the same conclusions rather than re-deriving them in
        TypeScript and quietly drifting from the exports.
      properties:
        timezone:
          type: string
          readOnly: true
        date_from:
          type: string
          format: date
          readOnly: true
        date_to:
          type: string
          format: date
          readOnly: true
        summary:
          allOf:
          - $ref: '#/components/schemas/EntrySummary'
          readOnly: true
        insights:
          allOf:
          - $ref: '#/components/schemas/ReportInsights'
          readOnly: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
          readOnly: true
      required:
      - date_from
      - date_to
      - entries
      - insights
      - summary
      - timezone
    EntrySummary:
      type: object
      properties:
        total:
          type: integer
          readOnly: true
        unique_visitors:
          type: integer
          readOnly: true
        by_result:
          allOf:
          - $ref: '#/components/schemas/ResultCounts'
          readOnly: true
        by_hour:
          type: array
          items:
            $ref: '#/components/schemas/HourBucket'
          readOnly: true
        by_country:
          type: array
          items:
            $ref: '#/components/schemas/CountryCount'
          readOnly: true
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
          readOnly: true
      required:
      - by_category
      - by_country
      - by_hour
      - by_result
      - total
      - unique_visitors
    FormatEnum:
      enum:
      - pdf
      - xlsx
      - csv
      type: string
      description: |-
        * `pdf` - pdf
        * `xlsx` - xlsx
        * `csv` - csv
    Health:
      type: object
      description: What a device gets back when it finds the server.
      properties:
        service:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        server_time:
          type: string
          format: date-time
          readOnly: true
        lan_ip:
          type: string
          readOnly: true
      required:
      - lan_ip
      - server_time
      - service
      - status
    HourBucket:
      type: object
      description: One local hour. `hour` carries its offset, so the client never
        guesses.
      properties:
        hour:
          type: string
          format: date-time
          readOnly: true
        total:
          type: integer
          readOnly: true
        valid:
          type: integer
          readOnly: true
        duplicate:
          type: integer
          readOnly: true
        refused:
          type: integer
          readOnly: true
      required:
      - duplicate
      - hour
      - refused
      - total
      - valid
    KindEnum:
      enum:
      - scanner
      - screen
      - desk
      type: string
      description: |-
        * `scanner` - Scanner
        * `screen` - Screen
        * `desk` - Desk
    LocaleEnum:
      enum:
      - en
      - pt
      - tet
      type: string
      description: |-
        * `en` - English
        * `pt` - Português
        * `tet` - Tetun
    MemoryNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        text:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - text
    NullEnum:
      enum:
      - null
    PairingCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        expires_at:
          type: string
          format: date-time
          readOnly: true
        used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - expires_at
      - id
      - kind
      - updated_at
      - used_at
    PairingCodeRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - kind
    PatchedRegistrationSettingsRequest:
      type: object
      description: The admin's view of the switch.
      properties:
        public_registration_enabled:
          type: boolean
    PatchedVisitorRequest:
      type: object
      description: |-
        `token_hash` is deliberately absent — it never leaves the database.

        `is_active` is read-only: it is switched through `POST /visitors/{id}/activate`
        and `/deactivate` so each change lands in the audit log as a named action
        rather than as an anonymous field edit buried in a PATCH of four other
        fields. Neither one touches the badge token, so the printed card keeps
        working across the whole cycle.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: binary
        category:
          $ref: '#/components/schemas/CategoryEnum'
    PublicRegistrationRequest:
      type: object
      description: '`POST /public/registrations`, multipart. Exactly these four fields.'
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          default: ''
          maxLength: 200
        photo:
          type: string
          format: binary
          description: JPEG, PNG or WebP, at most 5 MB. Re-encoded by the server.
      required:
      - country
      - full_name
      - photo
    PublicRegistrationResult:
      type: object
      description: |-
        Only what the success screen draws.

        `badge_token` is the QR payload -- a working credential, returned to the
        person it was just issued to and to nobody else. No id, no token hash, no
        photo URL: nothing here lets a caller find or fetch any other visitor.
      properties:
        full_name:
          type: string
        badge_serial:
          type: string
          description: Printed on the card; quoted at the kiosk desk if a scan fails.
        badge_token:
          type: string
          description: Raw badge token for the QR code. Returned once, never again.
      required:
      - badge_serial
      - badge_token
      - full_name
    PublicRegistrationStatus:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    RefreshTokenRequest:
      type: object
      description: |-
        Body for refresh/blacklist.

        Normally empty — the refresh token arrives in the `vms_refresh` cookie. The
        explicit field exists for non-browser clients (curl during a rehearsal).
      properties:
        refresh:
          type: string
    RegistrationSettings:
      type: object
      description: The admin's view of the switch.
      properties:
        public_registration_enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
          nullable: true
      required:
      - updated_at
      - updated_by
    ReissueResponse:
      type: object
      properties:
        issued:
          type: array
          items:
            $ref: '#/components/schemas/ReissuedBadge'
          readOnly: true
      required:
      - issued
    ReissuedBadge:
      type: object
      description: |-
        One reissued badge, including the RAW token.

        This is the same disclosure `POST /visitors` already makes, and for the same
        reason: the raw value exists for one moment and the caller gets the only copy.
        Admin-only, and the response is never cached.
      properties:
        visitor_id:
          type: string
          format: uuid
          readOnly: true
        badge_serial:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        token:
          type: string
          readOnly: true
          description: The raw badge token, exactly as the QR must encode it. Not
            stored; this response is the only copy.
      required:
      - badge_serial
      - category
      - full_name
      - token
      - visitor_id
    ReportEnum:
      enum:
      - entrance_report
      - visitor_list
      type: string
      description: |-
        * `entrance_report` - entrance_report
        * `visitor_list` - visitor_list
    ReportInsights:
      type: object
      description: |-
        The derived findings — what the counts mean.

        Served alongside the raw summary so the dashboard shows the same conclusions
        the PDF and the workbook print, rather than the page re-deriving them in
        TypeScript and quietly drifting.
      properties:
        registered:
          type: integer
          readOnly: true
        arrived:
          type: integer
          readOnly: true
        attendance_rate:
          type: number
          format: double
          readOnly: true
        refused:
          type: integer
          readOnly: true
        refusal_rate:
          type: number
          format: double
          readOnly: true
        quiet_hours:
          type: integer
          readOnly: true
        not_arrived_count:
          type: integer
          readOnly: true
        first_arrival:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_arrival:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        median_arrival:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        span_minutes:
          type: integer
          readOnly: true
        peak_hour:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        peak_total:
          type: integer
          readOnly: true
        peak_share:
          type: number
          format: double
          readOnly: true
        vip_arrived:
          type: integer
          readOnly: true
        vip_share:
          type: number
          format: double
          readOnly: true
        repeat_people:
          type: integer
          readOnly: true
        repeat_share:
          type: number
          format: double
          readOnly: true
        doors:
          type: array
          items:
            $ref: '#/components/schemas/DoorLoad'
          readOnly: true
        not_arrived:
          type: array
          items:
            $ref: '#/components/schemas/AbsentVisitor'
          readOnly: true
        narrative:
          type: array
          items:
            type: string
          readOnly: true
          description: The findings in sentences, in the order they should be read.
      required:
      - arrived
      - attendance_rate
      - doors
      - first_arrival
      - last_arrival
      - median_arrival
      - narrative
      - not_arrived
      - not_arrived_count
      - peak_hour
      - peak_share
      - peak_total
      - quiet_hours
      - refusal_rate
      - refused
      - registered
      - repeat_people
      - repeat_share
      - span_minutes
      - vip_arrived
      - vip_share
    ResultCounts:
      type: object
      description: Always all four keys, zero-filled — see counts_by_result().
      properties:
        valid:
          type: integer
          readOnly: true
        invalid:
          type: integer
          readOnly: true
        revoked:
          type: integer
          readOnly: true
        duplicate:
          type: integer
          readOnly: true
      required:
      - duplicate
      - invalid
      - revoked
      - valid
    ResultEnum:
      enum:
      - valid
      - invalid
      - revoked
      - duplicate
      type: string
      description: |-
        * `valid` - Valid
        * `invalid` - Invalid
        * `revoked` - Revoked
        * `duplicate` - Duplicate
    RoleEnum:
      enum:
      - user
      - assistant
      type: string
      description: |-
        * `user` - User
        * `assistant` - Assistant
    ScanEvent:
      type: object
      description: The audit view of a scan — every row, including the failures.
      properties:
        id:
          type: integer
          readOnly: true
        visitor:
          type: string
          format: uuid
          nullable: true
        device:
          type: string
          format: uuid
        device_name:
          type: string
          readOnly: true
        scanned_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/ResultEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device
      - device_name
      - id
      - result
      - scanned_at
      - updated_at
    ScanRequestRequest:
      type: object
      description: What the guard's phone posts for each badge it sees.
      properties:
        token:
          type: string
          minLength: 1
          description: The raw token read out of the QR code.
          maxLength: 128
        scanned_at:
          type: string
          format: date-time
          description: When the badge was presented. Sent by the device, because the
            offline queue may sync minutes later. Defaults to now.
        client_uuid:
          type: string
          format: uuid
          nullable: true
          description: Identifier the device generated for this scan. Posting it twice
            returns the scan already recorded rather than creating a second one —
            the offline queue retries, and a lost response must not become a second
            arrival.
      required:
      - token
    ScanResponse:
      type: object
      description: |-
        The answer to `POST /scans` — always 200, with the verdict in `result`.

        `visitor` is null for an `invalid` scan; a forged badge resolves to nobody.
      properties:
        event_id:
          type: integer
          readOnly: true
        result:
          $ref: '#/components/schemas/ResultEnum'
        scanned_at:
          type: string
          format: date-time
        visitor:
          allOf:
          - $ref: '#/components/schemas/ScanVisitor'
          readOnly: true
          nullable: true
      required:
      - event_id
      - result
      - scanned_at
      - visitor
    ScanVisitor:
      type: object
      description: |-
        What the guard's phone shows: enough to match the face to the card.

        The photo is the point. A name tells a guard who the badge claims to be; only
        the photo tells them whether the person holding it is that person.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/CategoryEnum'
        badge_serial:
          type: string
          maxLength: 20
        photo_url:
          type: string
          format: uri
          readOnly: true
      required:
      - badge_serial
      - country
      - full_name
      - id
      - photo_url
    ScreenEvent:
      type: object
      description: |-
        What the lobby screen renders, and nothing more.

        Sent over the WebSocket and returned by the backfill endpoint, so both paths
        produce identical objects and the screen can dedupe on `id`.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        organization:
          type: string
          readOnly: true
        photo_url:
          type: string
          format: uri
          description: Absolute, and never derived from the request — see apps/common/media.py.
          readOnly: true
        category:
          type: string
          readOnly: true
        scanned_at:
          type: string
          format: date-time
      required:
      - category
      - country
      - full_name
      - id
      - organization
      - photo_url
      - scanned_at
    ScreenFeed:
      type: object
      description: |-
        `GET /screen/feed?since=` — the reconnect backfill.

        `last_id` is the cursor to send next. It advances even when the page was
        truncated, so a screen that has been down for an hour catches up over
        several polls instead of one huge response.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ScreenEvent'
          readOnly: true
        last_id:
          type: integer
          readOnly: true
      required:
      - events
      - last_id
    SourceEnum:
      enum:
      - admin
      - self
      - desk
      type: string
      description: |-
        * `admin` - Registered at the desk
        * `self` - Self-registered
        * `desk` - Registered at the walk-in desk
    User:
      type: object
      description: Admin account, as the dashboard sees it. Never exposes the password
        hash.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - id
      - last_login
      - username
    Visitor:
      type: object
      description: |-
        `token_hash` is deliberately absent — it never leaves the database.

        `is_active` is read-only: it is switched through `POST /visitors/{id}/activate`
        and `/deactivate` so each change lands in the audit log as a named action
        rather than as an anonymous field edit buried in a PATCH of four other
        fields. Neither one touches the badge token, so the printed card keeps
        working across the whole cycle.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        possible_duplicate:
          type: boolean
          readOnly: true
          description: Another registration has the same name and country.
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - badge_serial
      - country
      - created_at
      - full_name
      - id
      - is_active
      - photo
      - possible_duplicate
      - source
      - updated_at
    VisitorDetail:
      type: object
      description: '`GET /visitors/{id}` — the registration, its scans, and its badge
        token.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        possible_duplicate:
          type: boolean
          readOnly: true
          description: Another registration has the same name and country.
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        badge_token:
          type: string
          readOnly: true
          description: Raw badge token for the QR code. Stable for the life of the
            badge.
        scan_events:
          type: array
          items:
            $ref: '#/components/schemas/ScanEvent'
          readOnly: true
      required:
      - badge_serial
      - badge_token
      - country
      - created_at
      - full_name
      - id
      - is_active
      - photo
      - possible_duplicate
      - scan_events
      - source
      - updated_at
    VisitorIssued:
      type: object
      description: |-
        The response to `POST /visitors` — the one and only sight of the raw token.

        `badge_token` is what goes into the QR. It is not stored anywhere and cannot
        be recovered: the caller must print the card now (CLAUDE.md constraint #3).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        possible_duplicate:
          type: boolean
          readOnly: true
          description: Another registration has the same name and country.
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        badge_token:
          type: string
          readOnly: true
          description: Raw badge token for the QR code. Shown once, never again.
      required:
      - badge_serial
      - badge_token
      - country
      - created_at
      - full_name
      - id
      - is_active
      - photo
      - possible_duplicate
      - source
      - updated_at
    VisitorIssuedRequest:
      type: object
      description: |-
        The response to `POST /visitors` — the one and only sight of the raw token.

        `badge_token` is what goes into the QR. It is not stored anywhere and cannot
        be recovered: the caller must print the card now (CLAUDE.md constraint #3).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: binary
        category:
          $ref: '#/components/schemas/CategoryEnum'
      required:
      - country
      - full_name
      - photo
    VisitorList:
      type: object
      description: |-
        Documents `GET /visitors`, where the token is conditional.

        SCHEMA ONLY -- nothing serialises through this. The view picks
        `VisitorSerializer` or `VisitorWithTokenSerializer` per request depending on
        `?with_tokens=`, and OpenAPI has no way to say "this response shape depends
        on that query parameter". Declaring the union honestly, with `badge_token`
        optional, is closer to the truth than either half alone: a client is told the
        field may be absent and has to check, which is exactly the situation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        possible_duplicate:
          type: boolean
          readOnly: true
          description: Another registration has the same name and country.
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        badge_token:
          type: string
          description: Present only when the request asked for `with_tokens=true`.
            The raw badge token for the QR code, stable for the life of the badge.
      required:
      - badge_serial
      - country
      - created_at
      - full_name
      - id
      - is_active
      - photo
      - possible_duplicate
      - source
      - updated_at
    VisitorPurged:
      type: object
      description: |-
        What a permanent delete reports back.

        Not a ModelSerializer: by the time this is rendered the row is gone. It
        exists so the shape is in the schema and the dashboard can read
        `scans_orphaned` from a generated type rather than a hand-written one.
      properties:
        badge_serial:
          type: string
          description: The serial of the registration that was removed.
        scans_orphaned:
          type: integer
          description: Scan events kept but detached from the visitor. They still
            count towards the entrance log; they no longer say who presented the badge.
      required:
      - badge_serial
      - scans_orphaned
  securitySchemes:
    deviceAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Permanent token from `POST /api/v1/devices/pair`, sent as `Authorization:
        Device <token>`.'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
